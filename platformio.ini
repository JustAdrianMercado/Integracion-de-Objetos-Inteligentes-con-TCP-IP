
; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = sensor
src_dir = apps/firmware/src
include_dir = apps/firmware/include
lib_dir = packages
test_dir = tests/firmware

[env]
platform = espressif32@7.0.1
platform_packages = platformio/framework-arduinoespressif32@3.20017.0
framework = arduino
monitor_speed = 115200

[env:esp32doit-devkit-v1]
board = esp32doit-devkit-v1
build_src_filter = -<*> +<main.cpp> +<cliente/SensorUltrasonico.cpp> +<ControladorLedsLocal.cpp>

[env:sensor]
board = esp32doit-devkit-v1
build_src_filter =
    -<*>
    +<cliente/PrincipalSensor.cpp>
    +<cliente/ClienteTcp.cpp>
    +<cliente/SensorUltrasonico.cpp>

[env:actuador]
board = esp32dev
build_src_filter =
    -<*>
    +<cliente/PrincipalActuador.cpp>
    +<cliente/ClienteTcp.cpp>
    +<cliente/ControladorLeds.cpp>
