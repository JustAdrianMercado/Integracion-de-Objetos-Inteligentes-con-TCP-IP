; Firmware de los dos ESP32. Ejecutar desde la raiz: pio run -e sensor / pio run -e actuador
; Documentacion: https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = sensor
src_dir = apps/firmware/src
include_dir = apps/firmware/include
lib_dir = apps/firmware/lib

[env]
platform = espressif32@7.0.1
platform_packages = platformio/framework-arduinoespressif32@3.20017.0
framework = arduino
monitor_speed = 115200

; ESP32 DEVKIT V1 de 30 pines con el HC-SR04.
[env:sensor]
board = esp32doit-devkit-v1
build_src_filter = -<*> +<PrincipalSensor.cpp> +<ClienteTcp.cpp> +<SensorUltrasonico.cpp>

; ESP32 generico de 38 pines con los tres LEDs.
[env:actuador]
board = esp32dev
build_src_filter = -<*> +<PrincipalActuador.cpp> +<ClienteTcp.cpp> +<ControladorLeds.cpp>
